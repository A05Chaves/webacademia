{% extends 'gestion/base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card bg-dark text-light border-secondary rounded-4">
        <div class="card-body p-4 text-center">
          <i class="fa-solid fa-envelope-circle-check fa-3x text-success mb-3"></i>
          <h2>Solicitud procesada</h2>
          <p class="text-secondary">Si el usuario o documento coincide con el correo registrado, recibirás un enlace para restablecer la contraseña de esa cuenta.</p>
          <p class="small text-secondary">Revisa también las carpetas de correo no deseado y promociones.</p>
          <a href="{% url 'login' %}" class="btn btn-outline-light">Volver al login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
